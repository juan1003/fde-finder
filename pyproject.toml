[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-tracker"
version = "1.0.0"
description = "CLI tool to track top Forward Deployed Engineer (FDE) hiring opportunities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fde-tracker = "app:main"

[tool.setuptools.package-data]
"*" = ["data/*.json"]
